name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      # The same image docker-compose.yml uses. The test fixtures apply the
      # schema and migrations to the empty database themselves.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: keystone
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keystone -d keystone"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://keystone:keystone@localhost:5432/keystone
      DATABASE_URL_SYNC: postgresql://keystone:keystone@localhost:5432/keystone
      # No LLM keys: tests that need one, or the private dataset, skip with a
      # reason (shown by -rs).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Sensitive data
        run: python scripts/check_sensitive_data.py
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest -rs

  frontend:
    name: Frontend (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the build stage in frontend/Dockerfile.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Build
        run: npm run build
